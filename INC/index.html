
<!DOCTYPE html>
<html>
<head>
    <title>Sari-Sari Store Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Sari-Sari Store Inventory System</h1>
<style>
    h1 {
    font-size: 32px;
    font-weight: bold;
    color: white;
    margin: 0;
}

/* Header container */
.header {
    animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Optional subtitle */
.subtitle {
    color: #ecf0f1;
    font-size: 14px;
    margin-top: 5px;
}
</style>

<style>
    body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #86b9ef, #cfe9ff);
    margin: 0;
    padding: 0;
}

/* Title */
h1 {
    margin-top: 20px;
    color: #2c3e50;
}

/* Container Card */
.form {
    background: white;
    padding: 20px;
    margin: 20px auto;
    width: 60%;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
}

/* Inputs */
.form input {
    padding: 10px;
    margin: 8px;
    width: 25%;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
}

.form input:focus {
    border-color: #3498db;
    box-shadow: 0 0 5px #3498db;
}

/* Button */
button {
    padding: 10px 20px;
    background: #27ae60;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #219150;
    transform: scale(1.05);
}

/* Table */
table {
    margin: 20px auto;
    border-collapse: collapse;
    width: 80%;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Table Header */
th {
    background: #3498db;
    color: white;
}

/* Table Cells */
th, td {
    padding: 12px;
    text-align: center;
}

/* Zebra effect */
tr:nth-child(even) {
    background: #f2f2f2;
}

/* Hover effect */
tr:hover {
    background: #eaf6ff;
}

/* Status styles */
.low {
    color: white;
    background: #e74c3c;
    padding: 5px 10px;
    border-radius: 5px;
}

.ok {
    color: white;
    background: #2ecc71;
    padding: 5px 10px;
    border-radius: 5px;
}
.search-container {
    width: 50%;
    margin: 20px auto;
    position: relative;
}

/* Input */
.search-container input {
    width: 100%;
    padding: 12px 15px 12px 40px;
    border-radius: 25px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Icon */
.search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: #888;
}

/* Focus effect */
.search-container input:focus {
    border-color: #3498db;
    box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
}

/* Hover effect */
.search-container input:hover {
    border-color: #3498db;
}
</style>

<div class="form">
    <input type="text" id="name" placeholder="Product Name">
    <input type="number" id="quantity" placeholder="Quantity">
    <input type="number" id="price" placeholder="Price">
    <button onclick="addProduct()">Add Product</button>
</div>

<h2>Product List</h2>
<div class="search-container">
    <span class="search-icon"></span>
    <input type="text" id="search" placeholder="Search product..." onkeyup="displayProducts()">
</div>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Level</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="productList"></tbody>
</table>

<h2>Total Inventory Value: ₱<span id="totalValue">0.00</span></h2>

<script src="script.js"></script>
</body>
</html>
